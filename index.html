<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pattern Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090e;--s1:#0d1017;--s2:#131920;--b:#1e2738;--a:#3d8eff;--g:#00d4aa;--r:#ff4d6d;--y:#ffd060;--t:#e2e8f0;--m:#4a5568}
body{background:var(--bg);color:var(--t);font-family:-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--s1);border-bottom:1px solid var(--b);flex-shrink:0}
.logo{font-family:monospace;font-size:13px;font-weight:700;color:var(--a);letter-spacing:.05em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--g);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
#tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--b);flex-shrink:0}
.tab{flex:1;padding:11px 4px;font-size:11px;font-weight:700;text-align:center;color:var(--m);cursor:pointer;border-bottom:2px solid transparent;font-family:monospace;letter-spacing:.06em;transition:all .15s}
.tab.on{color:var(--a);border-bottom-color:var(--a)}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.pane{display:none;flex:1;overflow-y:auto;padding:10px 10px 80px}
.pane.on{display:flex;flex-direction:column}
/* TF */
.tf{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.tfb{padding:8px 4px;background:var(--s2);border:1px solid var(--b);color:var(--m);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;font-family:monospace;transition:all .1s}
.tfb.on{background:var(--a);border-color:var(--a);color:#fff}
/* SEARCH */
.sb{position:relative;margin-bottom:10px}
.sb input{width:100%;background:var(--s2);border:1px solid var(--b);color:var(--t);padding:10px 14px 10px 36px;border-radius:7px;font-size:13px;outline:none;font-family:inherit}
.sb input:focus{border-color:var(--a)}
.sb span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--m);font-family:monospace;font-size:12px}
/* SELECTED */
.sel-bar{background:rgba(61,142,255,.08);border:1px solid rgba(61,142,255,.2);border-radius:7px;padding:9px 12px;margin-bottom:10px;display:none;align-items:center;justify-content:space-between}
.sel-bar.on{display:flex}
.sel-name{font-size:12px;font-weight:700;color:var(--a);font-family:monospace}
.sel-clr{font-size:11px;color:var(--m);cursor:pointer;padding:3px 8px;background:var(--b);border-radius:4px;font-family:monospace}
/* CATEGORIES */
.cat-lbl{font-size:10px;color:var(--m);letter-spacing:.1em;text-transform:uppercase;padding:10px 2px 5px;font-family:monospace;border-top:1px solid var(--b);margin-top:4px}
.cat-lbl:first-child{border-top:none;margin-top:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:2px}
.pc{background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:9px;cursor:pointer;transition:border-color .1s}
.pc:active{transform:scale(.97)}
.pc.on{border-color:var(--a)}
.psig{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;display:inline-block;margin-bottom:4px;font-family:monospace}
.psig.b{background:rgba(0,212,170,.12);color:var(--g)}
.psig.s{background:rgba(255,77,109,.12);color:var(--r)}
.psig.n{background:rgba(255,208,96,.12);color:var(--y)}
.psvg{width:100%;height:30px;margin-bottom:4px;display:block}
.pn{font-size:11px;font-weight:700;color:var(--t);margin-bottom:1px;font-family:monospace;line-height:1.2}
.pd{font-size:10px;color:var(--m);line-height:1.3}
/* CANVAS */
.cvs-wrap{background:var(--s2);border:1px solid var(--b);border-radius:7px;padding:9px;margin-bottom:10px}
.cvs-lbl{font-size:10px;color:var(--m);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;font-family:monospace}
#cvs{display:block;width:100%;border-radius:5px;background:#0a0f1a;touch-action:none;border:1px solid var(--b)}
.arow{display:grid;grid-template-columns:1fr 2fr;gap:7px;margin-bottom:8px}
.btn{padding:12px;border-radius:7px;font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:monospace;letter-spacing:.04em;transition:all .1s}
.btn:active{transform:scale(.97)}
.bg{background:var(--s2);color:var(--m);border:1px solid var(--b)}
.bp{background:var(--a);color:#fff}
.bp:disabled{background:var(--b);color:var(--m);cursor:not-allowed}
/* RESULTS */
.rbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 8px;flex-shrink:0}
.rtitle{font-size:13px;font-weight:700;font-family:monospace;color:var(--a)}
.rcnt{font-size:12px;font-family:monospace;color:var(--g);font-weight:700}
.status{padding:9px 12px;background:var(--s2);border-radius:7px;font-size:11px;color:var(--m);margin-bottom:8px;display:flex;align-items:center;gap:7px;font-family:monospace;border:1px solid var(--b);min-height:38px;flex-shrink:0}
.spin{width:11px;height:11px;border:2px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:s .7s linear infinite;flex-shrink:0}
@keyframes s{to{transform:rotate(360deg)}}
.cards{display:flex;flex-direction:column;gap:7px}
.rc{background:var(--s2);border:1px solid var(--b);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:7px}
.rc-top{display:flex;justify-content:space-between;align-items:center}
.rc-name{font-size:16px;font-weight:700;font-family:monospace}
.rc-pair{font-size:10px;color:var(--m);font-family:monospace;margin-top:1px}
.sc-num{font-size:21px;font-weight:700;font-family:monospace}
.sc-num.h{color:var(--g)}.sc-num.m{color:var(--a)}.sc-num.l{color:var(--m)}
.sc-lbl{font-size:9px;color:var(--m);text-transform:uppercase;letter-spacing:.07em;text-align:right;font-family:monospace}
.sc-bar{height:2px;background:var(--b);border-radius:1px;overflow:hidden}
.sc-fill{height:100%;border-radius:1px}
.mc{height:52px}.mc canvas{width:100%!important;height:100%!important}
.rm{display:flex;gap:14px;font-size:10px;font-family:monospace;color:var(--m)}
.up{color:var(--g)}.dn{color:var(--r)}
.empty{text-align:center;padding:40px 20px;color:var(--m)}
.empty .ei{font-size:16px;margin-bottom:10px;font-family:monospace;letter-spacing:.15em}
.empty p{font-size:11px;line-height:1.6;font-family:monospace}
/* FIXED BTN */
#fixbtn{position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:var(--bg);border-top:1px solid var(--b);z-index:99}
#fixbtn .btn{width:100%;padding:14px;font-size:14px;background:var(--g);color:#000}
</style>
</head>
<body>
<div id="hdr"><div class="dot"></div><div class="logo">PATTERN // SCAN</div><div style="margin-left:auto;font-size:10px;color:var(--m);font-family:monospace" id="hs">ready</div></div>
<div id="tabs">
  <div class="tab on" data-p="lib">LIBRARY</div>
  <div class="tab" data-p="drw">DRAW</div>
  <div class="tab" data-p="res">RESULTS</div>
</div>
<div id="content">
  <!-- LIBRARY -->
  <div class="pane on" id="pane-lib">
    <div class="sb"><span>/&gt;</span><input type="text" id="psearch" placeholder="Search pattern..." oninput="fp()"></div>
    <div class="tf" id="tf-lib">
      <div class="tfb" data-tf="15">15m</div>
      <div class="tfb on" data-tf="60">1H</div>
      <div class="tfb" data-tf="240">4H</div>
      <div class="tfb" data-tf="D">1D</div>
    </div>
    <div class="sel-bar" id="selbar">
      <div><div style="font-size:9px;color:var(--m);font-family:monospace;letter-spacing:.07em;margin-bottom:2px">SELECTED</div><div class="sel-name" id="seln">--</div></div>
      <div class="sel-clr" onclick="clrp()">clear</div>
    </div>
    <div id="plist"></div>
  </div>
  <!-- DRAW -->
  <div class="pane" id="pane-drw">
    <div class="cvs-wrap">
      <div class="cvs-lbl"><span>DRAW PATTERN</span><span id="pts" style="color:var(--a)">0 pts</span></div>
      <canvas id="cvs" height="190"></canvas>
    </div>
    <div class="tf" id="tf-drw">
      <div class="tfb" data-tf="15">15m</div>
      <div class="tfb on" data-tf="60">1H</div>
      <div class="tfb" data-tf="240">4H</div>
      <div class="tfb" data-tf="D">1D</div>
    </div>
    <div class="arow">
      <button class="btn bg" onclick="clrc()">CLEAR</button>
      <button class="btn bp" id="scanbtn" disabled onclick="scanDraw()">SCAN</button>
    </div>
  </div>
  <!-- RESULTS -->
  <div class="pane" id="pane-res">
    <div class="rbar"><div class="rtitle" id="rtitle">RESULTS</div><div class="rcnt" id="rcnt"></div></div>
    <div class="status" id="stat"><span>Select a pattern or draw a shape</span></div>
    <div class="cards" id="cards"><div class="empty"><div class="ei">[ --- ]</div><p>Results appear here</p></div></div>
  </div>
</div>
<div id="fixbtn"><button class="btn" onclick="scanLibrary()">RUN SCAN</button></div>

let selP=null, tf='60';

// ---- TABS ----
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('pane-'+t.dataset.p).classList.add('on');
    document.getElementById('fixbtn').style.display=t.dataset.p==='lib'?'block':'none';
    if(t.dataset.p==='drw')setTimeout(initCvs,50);
  });
});

// ---- TF ----
function setTF(v){
  tf=v;
  document.querySelectorAll('.tfb').forEach(b=>b.classList.toggle('on',b.dataset.tf===v));
}
document.querySelectorAll('.tfb').forEach(b=>b.addEventListener('click',()=>setTF(b.dataset.tf)));

// ---- PATTERNS ----
function svg(sh,sig){
  const w=108,h=28,pad=2;
  const col=sig==='b'?'#00d4aa':sig==='s'?'#ff4d6d':'#ffd060';
  const pts=sh.map((v,i)=>({x:pad+(i/(sh.length-1))*(w-pad*2),y:pad+(1-v)*(h-pad*2)}));
  const d=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const uid='u'+Math.random().toString(36).slice(2,7);
  return`<svg viewBox="0 0 ${w} ${h}" class="psvg"><defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity=".2"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${pts[pts.length-1].x},${h} L${pts[0].x},${h}Z" fill="url(#${uid})"/><path d="${d}" stroke="${col}" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function fp(){
  const q=document.getElementById('psearch').value.toLowerCase();
  const cats={};
  P.forEach((p,i)=>{
    if(q&&!p.n.toLowerCase().includes(q)&&!p.d.toLowerCase().includes(q))return;
    if(!cats[p.c])cats[p.c]=[];
    cats[p.c].push({...p,i});
  });
  document.getElementById('plist').innerHTML=Object.entries(cats).map(([cat,ps])=>
    `<div class="cat-lbl">${cat}</div><div class="pgrid">${ps.map(p=>`
    <div class="pc${selP===p.i?' on':''}" onclick="selPat(${p.i})">
      <span class="psig ${p.sig}">${p.sig==='b'?'LONG':p.sig==='s'?'SHORT':'NEUTRAL'}</span>
      ${svg(p.sh,p.sig)}
      <div class="pn">${p.n}</div>
      <div class="pd">${p.d}</div>
    </div>`).join('')}</div>`
  ).join('');
}
fp();

  document.getElementById('selbar').classList.add('on');

// ---- CANVAS ----
const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
let draw=false,pts=[];

function initCvs(){
  const dpr=window.devicePixelRatio||1;
  const w=cvs.offsetWidth;
  cvs.width=w*dpr; cvs.height=190*dpr;
  cvs.style.height='190px';
  ctx.scale(dpr,dpr);
  rdraw();
}
function rdraw(){
  const w=cvs.offsetWidth,h=190;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#1a2436';ctx.lineWidth=1;
  [1,2,3].forEach(i=>{ctx.beginPath();ctx.moveTo(0,h/4*i);ctx.lineTo(w,h/4*i);ctx.stroke()});
  if(pts.length<2)return;
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(61,142,255,.2)');g.addColorStop(1,'rgba(61,142,255,0)');
  ctx.beginPath();ctx.moveTo(pts[0].x,h);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,h);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.strokeStyle='#5ba8ff';ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';
  pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();
}
function gxy(e){
  const r=cvs.getBoundingClientRect(),s=e.touches?e.touches[0]:e;
  return{x:s.clientX-r.left,y:s.clientY-r.top};
}
cvs.addEventListener('mousedown',e=>{draw=true;pts=[];pts.push(gxy(e));rdraw();});
cvs.addEventListener('mousemove',e=>{
  if(!draw)return;
  const p=gxy(e),l=pts[pts.length-1];
  if(Math.hypot(p.x-l.x,p.y-l.y)>3){pts.push(p);rdraw();document.getElementById('pts').textContent=pts.length+' pts';}
});
cvs.addEventListener('mouseup',()=>{draw=false;if(pts.length>10)document.getElementById('scanbtn').disabled=false;});
cvs.addEventListener('touchstart',e=>{e.preventDefault();draw=true;pts=[];pts.push(gxy(e));rdraw();},{passive:false});
cvs.addEventListener('touchmove',e=>{
  e.preventDefault();if(!draw)return;
  const p=gxy(e),l=pts[pts.length-1];
  if(Math.hypot(p.x-l.x,p.y-l.y)>3){pts.push(p);rdraw();document.getElementById('pts').textContent=pts.length+' pts';}
},{passive:false});
cvs.addEventListener('touchend',()=>{draw=false;if(pts.length>10)document.getElementById('scanbtn').disabled=false;});
function clrc(){
  pts=[];ctx.clearRect(0,0,cvs.offsetWidth,190);
  document.getElementById('scanbtn').disabled=true;
  document.getElementById('pts').textContent='0 pts';
}
window.addEventListener('resize',initCvs);
setTimeout(initCvs,100);

// ---- NORMALIZE ----
function norm(arr,len=120){
  if(arr.length<2)return[];
  const step=(arr.length-1)/(len-1);
  const res=Array.from({length:len},(_,i)=>{
    const idx=i*step,lo=Math.floor(idx),hi=Math.min(Math.ceil(idx),arr.length-1),t=idx-lo;
    return arr[lo]+t*(arr[hi]-arr[lo]);
  });
  const mn=Math.min(...res),mx=Math.max(...res),rng=mx-mn||1;
  return res.map(v=>(v-mn)/rng);
}
function ptsNorm(p,len=120){
  const totalD=p.reduce((s,pt,i)=>i?s+Math.hypot(pt.x-p[i-1].x,pt.y-p[i-1].y):0,0);
  const res=[p[0]];let d=0,j=1,step=totalD/(len-1);
  while(res.length<len&&j<p.length){
    const seg=Math.hypot(p[j].x-p[j-1].x,p[j].y-p[j-1].y);
    if(d+seg>=step*res.length){const t=(step*res.length-d)/seg;res.push({x:p[j-1].x+t*(p[j].x-p[j-1].x),y:p[j-1].y+t*(p[j].y-p[j-1].y)});}
    else{d+=seg;j++;}
  }
  while(res.length<len)res.push(p[p.length-1]);
  const ys=res.map(pt=>-pt.y),mn=Math.min(...ys),mx=Math.max(...ys),rng=mx-mn||1;
  return ys.map(v=>(v-mn)/rng);
}

// ---- DTW с окном Сакое-Чиба ----
function dtw(a,b,w=30){
  const n=a.length,m=b.length;
  const dp=Array.from({length:n},()=>new Float32Array(m).fill(Infinity));
  dp[0][0]=Math.abs(a[0]-b[0]);
  for(let i=1;i<n;i++)dp[i][0]=dp[i-1][0]+Math.abs(a[i]-b[0]);
  for(let j=1;j<m;j++)dp[0][j]=dp[0][j-1]+Math.abs(a[0]-b[j]);
  for(let i=1;i<n;i++)
    for(let j=Math.max(1,i-w);j<=Math.min(m-1,i+w);j++)
      dp[i][j]=Math.abs(a[i]-b[j])+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[n-1][m-1];
}

// Скользящее окно — ищем паттерн в разных участках графика
function bestMatch(pat,candles){
  const closes=candles.map(c=>c.c);
  const L=pat.length;
  const winSizes=[40,50,60,70,80];
  let best=0;
  for(const win of winSizes){
    if(closes.length<win)continue;
    for(let i=Math.max(0,closes.length-win-20);i<=closes.length-Math.floor(win*.7);i++){
      const slice=closes.slice(i,i+win);
      const n=norm(slice,L);
      const score=Math.max(0,1-dtw(pat,n)/L*1.2);
      if(score>best)best=score;
    }
  }
  // также сравниваем весь массив
  const full=norm(closes,L);
  const fullScore=Math.max(0,1-dtw(pat,full)/L*1.2);
  return Math.max(best,fullScore);
}

// ---- SYMBOLS ----
const SYM=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','ADAUSDT','DOGEUSDT','AVAXUSDT','DOTUSDT','MATICUSDT','LINKUSDT','UNIUSDT','ATOMUSDT','LTCUSDT','NEARUSDT','APTUSDT','ARBUSDT','OPUSDT','INJUSDT','SUIUSDT','SEIUSDT','TIAUSDT','WLDUSDT','STXUSDT','RUNEUSDT','JUPUSDT','ENAUSDT','MNTUSDT','LDOUSDT','AAVEUSDT','MKRUSDT','CRVUSDT','GMXUSDT','SANDUSDT','FETUSDT','RENDERUSDT','THETAUSDT','FLOWUSDT','IMXUSDT','GALAUSDT','FTMUSDT','ALGOUSDT','EGLDUSDT','XTZUSDT','AXSUSDT','MANAUSDT','ENJUSDT','CHZUSDT','ZILUSDT','IOTAUSDT'];

async function fetchC(sym,interval,limit=100){
  try{
    const r=await fetch(`https://api.bybit.com/v5/market/kline?symbol=${sym}&interval=${interval}&limit=${limit}&category=linear`);
    const d=await r.json();
    if(d.result?.list?.length>0)return d.result.list.reverse().map(c=>({c:parseFloat(c[4])}));
  }catch(e){}
  return null;
}

function setStat(msg,loading=false){
  document.getElementById('stat').innerHTML=loading?`<div class="spin"></div><span>${msg}</span>`:`<span>${msg}</span>`;
  document.getElementById('hs').textContent=loading?'scanning...':'ready';
}

function miniChart(c,closes,col){
  const ctx=c.getContext('2d'),w=c.width=c.offsetWidth,h=c.height=52;
  ctx.clearRect(0,0,w,h);
  const mn=Math.min(...closes),mx=Math.max(...closes),rng=mx-mn||1;
  const p=closes.map((v,i)=>({x:(i/(closes.length-1))*w,y:h-((v-mn)/rng)*(h-4)-2}));
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,col+'40');g.addColorStop(1,col+'00');
  ctx.beginPath();ctx.moveTo(p[0].x,h);p.forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.lineTo(p[p.length-1].x,h);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();p.forEach((pt,i)=>i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y));ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
}

async function runScan(patNorm,title){
  // switch to results
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  document.querySelector('[data-p="res"]').classList.add('on');
  document.getElementById('pane-res').classList.add('on');
  document.getElementById('fixbtn').style.display='none';
  document.getElementById('rtitle').textContent=title;
  setStat(`Loading... 0/${SYM.length}`,true);
  document.getElementById('cards').innerHTML='<div class="empty"><div class="ei">[ --- ]</div><p>Scanning...</p></div>';
  document.getElementById('rcnt').textContent='';

  const results=[];let done=0;
  await Promise.all(SYM.map(async sym=>{
    const candles=await fetchC(sym,tf,100);
    done++;
    if(done%10===0)setStat(`Loading... ${done}/${SYM.length}`,true);
    if(!candles||candles.length<20)return;
    const score=bestMatch(patNorm,candles);
    const closes=candles.map(c=>c.c);
    const chg=((closes[closes.length-1]-closes[0])/closes[0]*100).toFixed(2);
    results.push({sym,score,closes,price:closes[closes.length-1],chg:parseFloat(chg)});
  }));

  results.sort((a,b)=>b.score-a.score);
  const top=results.slice(0,20);
  setStat(`Done — ${top.length} matches from ${SYM.length} pairs`,false);
  document.getElementById('rcnt').textContent=top.length;

  if(!top.length){
    document.getElementById('cards').innerHTML='<div class="empty"><div class="ei">[ --- ]</div><p>No matches found</p></div>';
    return;
  }

  document.getElementById('cards').innerHTML=top.map(r=>{
    const pct=Math.round(r.score*100);
    const sc=pct>=75?'h':pct>=55?'m':'l';
    const col=pct>=75?'#00d4aa':pct>=55?'#3d8eff':'#4a5568';
    const base=r.sym.replace('USDT','');
    const chgc=r.chg>=0?'up':'dn';
    const chgs=(r.chg>=0?'+':'')+r.chg+'%';
    const pr=r.price<1?r.price.toFixed(5):r.price<10?r.price.toFixed(4):r.price<1000?r.price.toFixed(2):r.price.toFixed(0);
    return`<div class="rc">
      <div class="rc-top">
        <div><div class="rc-name">${base}</div><div class="rc-pair">${r.sym} &middot; ${tf==='D'?'1D':tf+'m'}</div></div>
        <div><div class="sc-num ${sc}">${pct}%</div><div class="sc-lbl">match</div></div>
      </div>
      <div class="sc-bar"><div class="sc-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="mc"><canvas id="mc_${r.sym}"></canvas></div>
      <div class="rm"><span>$${pr}</span><span class="${chgc}">${chgs}</span><span style="margin-left:auto">${r.closes.length} candles</span></div>
    </div>`;
  }).join('');

  top.forEach(r=>{
    requestAnimationFrame(()=>{
      const c=document.getElementById('mc_'+r.sym);
      if(c){const pct=Math.round(r.score*100);miniChart(c,r.closes,pct>=75?'#00d4aa':pct>=55?'#3d8eff':'#4a5568');}
    });
  });
}

function scanLibrary(){
  if(selP===null){alert('Select a pattern first');return;}
  runScan(norm(P[selP].sh,120),P[selP].n);
}
function scanDraw(){
  if(pts.length<10)return;
  runScan(ptsNorm(pts,120),'Custom Pattern');
}
