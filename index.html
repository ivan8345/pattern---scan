<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>Pattern Scanner</title><style> *,*::before,*::after{box-sizing:border-box;margin:0;padding:0} :root{--bg:#080b10;--s1:#0f1318;--s2:#161b22;--s3:#1c2330;--border:#21283a;--accent:#3d8eff;--green:#00d4aa;--red:#ff4d6d;--yellow:#ffd060;--text:#e2e8f0;--muted:#4a5568;--dim:#2d3748} body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;min-height:100vh;overflow-x:hidden} /* HEADER */ .header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--s1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100} .logo{font-family:'Courier New',monospace;font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.05em} .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0} @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}} /* TABS */ .tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);position:sticky;top:49px;z-index:99} .tab{flex:1;padding:12px 8px;font-size:12px;font-weight:600;text-align:center;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.03em} .tab.active{color:var(--accent);border-bottom-color:var(--accent)} /* SECTIONS */ .section{display:none;padding:12px 12px 80px} .section.active{display:block} /* PATTERN LIBRARY */ .search-box{position:relative;margin-bottom:12px} .search-box input{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--text);padding:11px 16px 11px 40px;border-radius:10px;font-size:14px;outline:none} .search-box input:focus{border-color:var(--accent)} .search-box .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px} .category-label{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:8px 4px 6px;font-weight:600} .pattern-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px} .pattern-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 10px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden} .pattern-card:active{transform:scale(.97)} .pattern-card.selected{border-color:var(--accent);background:rgba(61,142,255,.08)} .pattern-card .pname{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3} .pattern-card .pdesc{font-size:10px;color:var(--muted);line-height:1.4} .pattern-card .psignal{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px} .psignal.bull{background:rgba(0,212,170,.15);color:var(--green)} .psignal.bear{background:rgba(255,77,109,.15);color:var(--red)} .psignal.neut{background:rgba(255,208,96,.15);color:var(--yellow)} .pattern-svg{width:100%;height:36px;margin-bottom:6px} /* DRAW SECTION */ .canvas-container{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:12px} .canvas-label{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between} #drawCanvas{display:block;width:100%;border-radius:8px;background:var(--bg);touch-action:none;cursor:crosshair} .tf-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px} .tf-btn{padding:9px 4px;background:var(--s2);border:1px solid var(--border);color:var(--muted);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;font-family:monospace} .tf-btn.active{background:var(--accent);border-color:var(--accent);color:#fff} .action-row{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-bottom:10px} .btn{padding:13px;border-radius:10px;font-size:13px;font-weight:700;border:none;cursor:pointer;text-align:center;transition:all .15s;letter-spacing:.02em} .btn:active{transform:scale(.97)} .btn-ghost{background:var(--s2);color:var(--muted);border:1px solid var(--border)} .btn-primary{background:var(--accent);color:#fff} .btn-primary:disabled{background:var(--dim);color:var(--muted);cursor:not-allowed} .btn-green{background:var(--green);color:#000} /* RESULTS */ .results-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;margin-bottom:8px} .results-bar .rtitle{font-size:13px;font-weight:600} .results-bar .rcount{font-size:12px;font-family:monospace;color:var(--green);font-weight:700} .status{padding:10px 14px;background:var(--s2);border-radius:10px;font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;font-family:monospace;min-height:42px} .spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0} @keyframes spin{to{transform:rotate(360deg)}} .cards{display:flex;flex-direction:column;gap:8px} .rcard{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px} .rcard-top{display:flex;justify-content:space-between;align-items:center} .rcard-name{font-size:16px;font-weight:700;color:var(--text)} .rcard-pair{font-size:11px;color:var(--muted);font-family:monospace;margin-top:2px} .rcard-score{text-align:right} .score-num{font-size:22px;font-weight:700;font-family:monospace} .score-num.high{color:var(--green)} .score-num.mid{color:var(--accent)} .score-num.low{color:var(--muted)} .score-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em} .score-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden} .score-fill{height:100%;border-radius:2px;transition:width .6s ease} .rcard-chart{height:56px} .rcard-chart canvas{width:100%!important;height:100%!important} .rcard-meta{display:flex;gap:16px;font-size:11px;font-family:monospace;color:var(--muted)} .up{color:var(--green)}.down{color:var(--red)} .empty{text-align:center;padding:48px 20px;color:var(--muted)} .empty .ei{font-size:44px;margin-bottom:12px} .empty p{font-size:13px;line-height:1.6} /* SCAN BTN FIXED */ .scan-fixed{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:var(--bg);border-top:1px solid var(--border);z-index:200} .scan-fixed .btn{width:100%;padding:15px;font-size:15px} /* SELECTED PATTERN BAR */ .selected-bar{background:rgba(61,142,255,.1);border:1px solid rgba(61,142,255,.3);border-radius:10px;padding:10px 14px;margin-bottom:10px;display:none;align-items:center;justify-content:space-between} .selected-bar.show{display:flex} .selected-bar .sname{font-size:13px;font-weight:600;color:var(--accent)} .selected-bar .sclear{font-size:11px;color:var(--muted);cursor:pointer;padding:4px 8px;background:var(--border);border-radius:6px} </style></head><body> <div class="header"> <div class="dot"></div> <div class="logo">PATTERN//SCAN</div> <div style="margin-left:auto;font-size:11px;color:var(--muted);font-family:monospace" id="hstatus">ready</div> </div> <div class="tabs"> <div class="tab active" data-tab="library">LIBRARY</div> <div class="tab" data-tab="draw">DRAW</div> <div class="tab" data-tab="results">RESULTS</div> </div> <!-- LIBRARY TAB --> <div class="section active" id="tab-library"> <div class="search-box"> <span class="icon" style="font-family:monospace">/&gt;</span> <input type="text" id="patternSearch" placeholder="Search pattern..." oninput="filterPatterns()"> </div> <div class="timeframe-tabs" id="tfLib" style="display:flex;gap:6px;margin-bottom:12px"> <button class="tf-tab" data-tf="15">15m</button> <button class="tf-tab active" data-tf="60">1H</button> <button class="tf-tab" data-tf="240">4H</button> <button class="tf-tab" data-tf="D">1D</button> </div> <div class="tf-row" id="tfLib"> <button class="tf-btn" data-tf="15">15m</button> <button class="tf-btn active" data-tf="60">1H</button> <button class="tf-btn" data-tf="240">4H</button> <button class="tf-btn" data-tf="D">1D</button> </div> <div class="selected-bar" id="selectedBar"> <div> <div style="font-size:10px;color:var(--muted);margin-bottom:2px">SELECTED</div> <div class="sname" id="selectedName">—</div> </div> <div class="sclear" onclick="clearPattern()">✕ CLEAR</div> </div> <div id="patternList"></div> </div> <!-- DRAW TAB --> <div class="section" id="tab-draw"> <div class="canvas-container"> <div class="canvas-label"> <span>Рисуй пальцем</span> <span id="ptCount" style="color:var(--accent);font-family:monospace">0 pts</span> </div> <canvas id="drawCanvas" height="200"></canvas> </div> <div class="tf-row" id="tfRow"> <div class="tf-btn" data-tf="15">15m</div> <div class="tf-btn active" data-tf="60">1H</div> <div class="tf-btn" data-tf="240">4H</div> <div class="tf-btn" data-tf="D">1D</div> </div> <div class="action-row"> <button class="btn btn-ghost" onclick="clearCanvas()">CLEAR</button> <button class="btn btn-primary" id="scanDrawBtn" disabled onclick="scanDraw()">SCAN</button> </div> </div> <!-- RESULTS TAB --> <div class="section" id="tab-results"> <div class="results-bar"> <div class="rtitle" id="resultsTitle">Результаты</div> <div class="rcount" id="resultsCount"></div> </div> <div class="status" id="statusEl"><span>Выбери паттерн или нарисуй форму</span></div> <div class="cards" id="cardsEl"> <div class="empty"><div class="ei">📈</div><p>Здесь появятся токены<br>похожие на твой паттерн</p></div> </div> </div> <!-- FIXED SCAN BUTTON (library tab) --> <div class="scan-fixed" id="scanFixed"> <button class="btn btn-green" id="scanLibBtn" onclick="scanLibrary()">RUN SCAN</button> </div> <script> // ===== TABS ===== document.querySelectorAll('.tab').forEach(t=>{ t.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.querySelectorAll('.section').forEach(x=>x.classList.remove('active')); t.classList.add('active'); document.getElementById('tab-'+t.dataset.tab).classList.add('active'); document.getElementById('scanFixed').style.display = t.dataset.tab==='library'?'block':'none'; }); }); document.getElementById('scanFixed').style.display='block'; // ===== TIMEFRAME ===== let selectedTF='60'; document.querySelectorAll('.tf-btn').forEach(b=>{ b.addEventListener('click',()=>{ document.querySelectorAll('.tf-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); selectedTF=b.dataset.tf; }); }); // ===== PATTERNS DATA ===== const PATTERNS = [ // РАЗВОРОТНЫЕ БЫЧЬИ {cat:'REVERSAL BULLISH', name:'Голова и плечи (инверт.)', desc:'Три впадины, средняя глубже. Сигнал роста.', signal:'bull', shape:[0,.3,.1,.5,0,.3,.1]}, {cat:'REVERSAL BULLISH', name:'Двойное дно (W)', desc:'Два минимума на одном уровне. Классический разворот.', signal:'bull', shape:[0,.5,0,.5,0,.2]}, {cat:'REVERSAL BULLISH', name:'Тройное дно', desc:'Три касания поддержки. Сильный разворот.', signal:'bull', shape:[0,.5,.1,.5,.1,.5,0,.1]}, {cat:'REVERSAL BULLISH', name:'Закруглённое дно', desc:'Плавный разворот вниз-вверх. Медленный бычий сигнал.', signal:'bull', shape:[.2,.1,0,.05,.1,.3,.6,1]}, {cat:'REVERSAL BULLISH', name:'Бычий молот', desc:'Резкое падение и отскок. Конец нисходящего тренда.', signal:'bull', shape:[.8,.3,0,.3,.7,1]}, {cat:'REVERSAL BULLISH', name:'Утренняя звезда', desc:'Падение, консолидация, резкий рост.', signal:'bull', shape:[1,.7,.5,.4,.4,.5,.8,1]}, {cat:'REVERSAL BULLISH', name:'Бычье поглощение', desc:'Резкий разворот после нисходящего тренда.', signal:'bull', shape:[.8,.6,.4,.3,.5,.9,1]}, {cat:'REVERSAL BULLISH', name:'Пробой поддержки вверх', desc:'Ложный пробой вниз и резкий отскок.', signal:'bull', shape:[.5,.3,.1,0,.2,.6,1]}, {cat:'REVERSAL BULLISH', name:'V-разворот', desc:'Резкое падение и такой же резкий отскок.', signal:'bull', shape:[1,.8,.5,.2,0,.3,.6,1]}, {cat:'REVERSAL BULLISH', name:'Чашка с ручкой', desc:'Закруглённое дно + небольшая коррекция перед ростом.', signal:'bull', shape:[.5,.2,0,.1,.3,.7,.5,.6,.8,1]}, // РАЗВОРОТНЫЕ МЕДВЕЖЬИ {cat:'REVERSAL BEARISH', name:'Голова и плечи', desc:'Три вершины, средняя выше. Классический разворот вниз.', signal:'bear', shape:[.3,.7,.5,1,.6,.7,.4,0]}, {cat:'REVERSAL BEARISH', name:'Двойная вершина (M)', desc:'Два максимума на одном уровне. Сигнал падения.', signal:'bear', shape:[.5,1,.5,1,.5,0]}, {cat:'REVERSAL BEARISH', name:'Тройная вершина', desc:'Три касания сопротивления. Сильный разворот вниз.', signal:'bear', shape:[.5,1,.4,1,.4,1,.5,0]}, {cat:'REVERSAL BEARISH', name:'Закруглённая вершина', desc:'Плавный разворот вверх-вниз. Медвежий сигнал.', signal:'bear', shape:[.4,.7,1,.9,.7,.4,.1,0]}, {cat:'REVERSAL BEARISH', name:'Медвежья звезда', desc:'Рост, консолидация, резкое падение.', signal:'bear', shape:[0,.3,.5,.6,.6,.5,.3,0]}, {cat:'REVERSAL BEARISH', name:'Медвежье поглощение', desc:'Резкий разворот после восходящего тренда.', signal:'bear', shape:[.2,.4,.7,.9,1,.5,.1,0]}, {cat:'REVERSAL BEARISH', name:'Пробой сопротивления вниз', desc:'Ложный пробой вверх и резкое падение.', signal:'bear', shape:[.5,.7,.9,1,.8,.4,0]}, {cat:'REVERSAL BEARISH', name:'Перевёрнутая чашка', desc:'Закруглённая вершина + небольшой отскок перед падением.', signal:'bear', shape:[.5,.8,1,.9,.7,.3,.5,.4,.2,0]}, {cat:'REVERSAL BEARISH', name:'Вечерняя звезда', desc:'Рост, неуверенность, падение.', signal:'bear', shape:[0,.2,.5,.7,.8,.7,.5,.2,0]}, {cat:'REVERSAL BEARISH', name:'Медвежий V', desc:'Резкий рост и такой же резкий обвал.', signal:'bear', shape:[0,.3,.6,.9,1,.7,.4,.1,0]}, // ПРОДОЛЖЕНИЕ ТРЕНДА БЫЧЬЕ {cat:'CONTINUATION BULLISH', name:'Бычий флаг', desc:'Рост → консолидация → продолжение роста.', signal:'bull', shape:[0,.4,.8,.7,.6,.65,.75,.7,.65,1]}, {cat:'CONTINUATION BULLISH', name:'Бычий вымпел', desc:'Резкий рост → сжатие → продолжение.', signal:'bull', shape:[0,.5,1,.8,.6,.7,.65,.8,1]}, {cat:'CONTINUATION BULLISH', name:'Восходящий треугольник', desc:'Горизонтальное сопротивлени BOLS.map(async sym=>{ const candles=await fetchCandles(sym,selectedTF,100); done++; if(done%10===0)setStatus(`Загружаем... ${done}/${SYMBOLS.length}`,true); if(!candles||candles.length<20)return; const score=bestWindowMatch(patternNorm,candles,Math.min(60,candles.length)); const closes=candles.map(c=>c.c); const chg=((closes[closes.length-1]-closes[0])/closes[0]*100).toFixed(2); results.push({symbol:sym,score,closes,price:closes[closes.length-1],chg:parseFloat(chg)}); })); results.sort((a,b)=>b.score-a.score); const top=results.slice(0,20); setStatus(`Готово — найдено совпадений: ${top.length} из ${SYMBOLS.length} пар`,false); document.getElementById('resultsCount').textContent=top.length; document.getElementById('resultsTitle').textContent='Results'; if(!top.length){ document.getElementById('cardsEl').innerHTML='<div class="empty"><div class="ei">🔍</div><p>Совпадений не найдено</p></div>'; return; } document.getElementById('cardsEl').innerHTML=top.map(r=>{ const pct=Math.round(r.score*100); const sc=pct>=75?'high':pct>=55?'mid':'low'; const color=pct>=75?'#00d4aa':pct>=55?'#3d8eff':'#4a5568'; const base=r.symbol.replace('USDT',''); const chgCls=r.chg>=0?'up':'down'; const chgStr=(r.chg>=0?'+':'')+r.chg+'%'; const price=r.price<1?r.price.toFixed(5):r.price<10?r.price.toFixed(4):r.price<1000?r.price.toFixed(2):r.price.toFixed(0); return`<div class="rcard"> <div class="rcard-top"> <div><div class="rcard-name">${base}</div><div class="rcard-pair">${r.symbol} · ${selectedTF==='D'?'1D':selectedTF+'m'}</div></div> <div class="rcard-score"><div class="score-num ${sc}">${pct}%</div><div class="score-lbl">совпадение</div></div> </div> <div class="score-bar"><div class="score-fill" style="width:${pct}%;background:${color}"></div></div> <div class="rcard-chart"><canvas id="mc_${r.symbol}"></canvas></div> <div class="rcard-meta"><span>$${price}</span><span class="${chgCls}">${chgStr}</span><span style="margin-left:auto;color:var(--muted)">${r.closes.length} candles</span></div> </div>`; }).join(''); top.forEach(r=>{ requestAnimationFrame(()=>{ const c=document.getElementById('mc_'+r.symbol); if(c){const pct=Math.round(r.score*100);const color=pct>=75?'#00d4aa':pct>=55?'#3d8eff':'#4a5568';drawMini(c,r.closes,color);} }); }); } async function scanLibrary(){ if(selectedPattern===null){alert('Select a pattern first');return;} const p=PATTERNS[selectedPattern]; const norm=normalize(p.shape,100); document.getElementById('resultsTitle').textContent=p.name; await runScan(norm); } async function scanDraw(){ if(rawPts.length<10)return; const norm=ptsToNorm(rawPts,100); document.getElementById('resultsTitle').textContent='Custom Pattern'; await runScan(norm); } </script></body></html>
