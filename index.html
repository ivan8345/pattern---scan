<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pattern Scanner</title><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap');*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0a0c10;--surface:#111318;--surface2:#181c24;--border:#1f2430;--accent:#3d8eff;--accent2:#00d4aa;--red:#ff4d6d;--green:#00d4aa;--text:#e2e8f0;--muted:#4a5568;--dim:#2d3748}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;background:var(--surface)}.logo{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--accent)}.tagline{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.main{display:flex;flex-direction:column;flex:1}.left-panel{border-bottom:1px solid var(--border);background:var(--surface)}.panel-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between}.canvas-wrap{position:relative;padding:12px}#drawCanvas{background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:crosshair;display:block;width:100%;touch-action:none}.canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .3s}.canvas-hint.hidden{opacity:0}.canvas-hint .icon{font-size:28px;margin-bottom:6px}.canvas-hint p{font-size:11px;color:var(--muted);line-height:1.6}.controls{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:8px}select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:4px;font-size:12px;font-family:'JetBrains Mono',monospace;flex:1;cursor:pointer;outline:none;appearance:none}select:focus{border-color:var(--accent)}.btn{padding:10px 16px;border-radius:4px;font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:600;border:none;cursor:pointer;transition:all .15s}.btn-primary{background:var(--accent);color:#fff;flex:1}.btn-primary:disabled{background:var(--dim);color:var(--muted);cursor:not-allowed}.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.setting-label{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}.timeframe-tabs{display:flex;gap:2px}.tf-tab{padding:6px 12px;font-size:10px;font-family:'JetBrains Mono',monospace;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;border-radius:3px;transition:all .1s}.tf-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}.right-panel{display:flex;flex-direction:column;flex:1;background:var(--bg)}.results-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface)}.count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}.count span{color:var(--accent2);font-weight:600}.status-bar{padding:8px 16px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);border-bottom:1px solid var(--border);min-height:34px;display:flex;align-items:center;gap:8px}.loader{width:10px;height:10px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}@keyframes spin{to{transform:rotate(360deg)}}.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}.result-card{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:6px}.card-top{display:flex;justify-content:space-between;align-items:flex-start}.token-name{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--text)}.token-pair{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace}.match-score{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600}.match-score.high{color:var(--accent2)}.match-score.mid{color:var(--accent)}.match-score.low{color:var(--muted)}.match-label{font-size:9px;color:var(--muted);text-align:right;font-family:'JetBrains Mono',monospace}.mini-chart{height:44px}.score-bar{height:2px;background:var(--border);border-radius:1px;overflow:hidden}.score-fill{height:100%;border-radius:1px}.card-meta{display:flex;gap:8px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted)}.change.up{color:var(--green)}.change.down{color:var(--red)}.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:12px;color:var(--muted)}.empty-state .big{font-size:40px}.empty-state p{font-size:12px;font-family:'JetBrains Mono',monospace}</style></head><body><header><div class="dot"></div><div class="logo">PATTERN//SCAN</div><div class="tagline">draw → match → trade</div></header><div class="main"><div class="left-panel"><div class="panel-header"><span>Draw Pattern</span><span id="pointCount">0 pts</span></div><div class="canvas-wrap"><canvas id="drawCanvas" height="180"></canvas><div class="canvas-hint" id="canvasHint"><div class="icon">✍️</div><p>Рисуй пальцем<br>Найдём похожие токены</p></div></div><div class="controls"><div><div class="setting-label">Таймфрейм</div><div class="timeframe-tabs" id="tfTabs"><button class="tf-tab" data-tf="15">15m</button><button class="tf-tab active" data-tf="60">1H</button><button class="tf-tab" data-tf="240">4H</button><button class="tf-tab" data-tf="D">1D</button></div></div><div class="settings-grid"><div><div class="setting-label">Биржа</div><select id="exchangeSel"><option value="bybit">Bybit</option></select></div><div><div class="setting-label">Топ</div><select id="topN"><option value="10">10</option><option value="20" selected>20</option></select></div></div><div class="row"><button class="btn btn-ghost" id="clearBtn">Очистить</button><button class="btn btn-primary" id="scanBtn" disabled>▶ Сканировать</button></div></div></div><div class="right-panel"><div class="results-header"><span style="font-size:13px;font-weight:500">Результаты</span><div class="count">Найдено: <span id="resultCount">—</span></div></div><div class="status-bar" id="statusBar"><span id="statusText">Нарисуй паттерн и нажми Сканировать</span></div><div id="resultsArea" style="display:flex;flex-direction:column;flex:1;overflow:hidden"><div class="empty-state" id="emptyState"><div class="big">📈</div><p>Результаты появятся здесь</p></div><div class="results-grid" id="resultsGrid" style="display:none"></div></div></div></div><script>const canvas=document.getElementById('drawCanvas');const ctx=canvas.getContext('2d');const hint=document.getElementById('canvasHint');const pointCountEl=document.getElementById('pointCount');const scanBtn=document.getElementById('scanBtn');const clearBtn=document.getElementById('clearBtn');const statusBar=document.getElementById('statusBar');const resultsGrid=document.getElementById('resultsGrid');const emptyState=document.getElementById('emptyState');const resultCount=document.getElementById('resultCount');let drawing=false;let rawPoints=[];let selectedTF='60';function resizeCanvas(){const wrap=canvas.parentElement;canvas.width=wrap.clientWidth-24;redrawCanvas()}function redrawCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);if(rawPoints.length<2)return;ctx.strokeStyle='#1a1f2e';ctx.lineWidth=1;for(let i=1;i<4;i++){const y=(canvas.height/4)*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke()}const grad=ctx.createLinearGradient(0,0,0,canvas.height);grad.addColorStop(0,'rgba(61,142,255,0.18)');grad.addColorStop(1,'rgba(61,142,255,0)');ctx.beginPath();ctx.moveTo(rawPoints[0].x,canvas.height);rawPoints.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(rawPoints[rawPoints.length-1].x,canvas.height);ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.beginPath();ctx.strokeStyle='#3d8eff';ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';rawPoints.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke()}function getPos(e){const r=canvas.getBoundingClientRect();if(e.touches){return{x:e.touches[0].clientX-r.left,y:e.touches[0].clientY-r.top}}return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('mousedown',e=>{drawing=true;rawPoints=[];hint.classList.add('hidden');rawPoints.push(getPos(e))});canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=getPos(e);const last=rawPoints[rawPoints.length-1];if(Math.hypot(p.x-last.x,p.y-last.y)>4){rawPoints.push(p);redrawCanvas();pointCountEl.textContent=rawPoints.length+' pts'}});canvas.addEventListener('mouseup',()=>{drawing=false;if(rawPoints.length>10)scanBtn.disabled=false});canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;rawPoints=[];hint.classList.add('hidden');rawPoints.push(getPos(e))},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);const last=rawPoints[rawPoints.length-1];if(Math.hypot(p.x-last.x,p.y-last.y)>4){rawPoints.push(p);redrawCanvas();pointCountEl.textContent=rawPoints.length+' pts'}}),{passive:false};canvas.addEventListener('touchend',()=>{drawing=false;if(rawPoints.length>10)scanBtn.disabled=false});clearBtn.addEventListener('click',()=>{rawPoints=[];ctx.clearRect(0,0,canvas.width,canvas.height);hint.classList.remove('hidden');scanBtn.disabled=true;pointCountEl.textContent='0 pts';resultsGrid.style.display='none';emptyState.style.display='flex';emptyState.innerHTML='<div class="big">📈</div><p>Результаты появятся здесь</p>';resultCount.textContent='—';setStatus('Нарисуй паттерн и нажми Сканировать',false)});document.querySelectorAll('.tf-tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tf-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');selectedTF=tab.dataset.tf})});function normalizePoints(points,len=50){if(points.length<2)return[];const totalDist=points.reduce((sum,p,i)=>{if(i===0)return 0;return sum+Math.hypot(p.x-points[i-1].x,p.y-points[i-1].y)},0);const resampled=[points[0]];let distSoFar=0;const step=totalDist/(len-1);let j=1;while(resampled.length<len&&j<points.length){const d=Math.hypot(points[j].x-points[j-1].x,points[j].y-points[j-1].y);if(distSoFar+d>=step*resampled.length){const t=(step*resampled.length-distSoFar)/d;resampled.push({x:points[j-1].x+t*(points[j].x-points[j-1].x),y:points[j-1].y+t*(points[j].y-points[j-1].y)})}else{distSoFar+=d;j++}}while(resampled.length<len)resampled.push(points[points.length-1]);const ys=resampled.map(p=>-p.y);const mn=Math.min(...ys),mx=Math.max(...ys);const range=mx-mn||1;return ys.map(y=>(y-mn)/range)}function dtw(a,b){const n=a.length,m=b.length;const dp=Array.from({length:n},()=>new Float32Array(m).fill(Infinity));dp[0][0]=Math.abs(a[0]-b[0]);for(let i=1;i<n;i++)dp[i][0]=dp[i-1][0]+Math.abs(a[i]-b[0]);for(let j=1;j<m;j++)dp[0][j]=dp[0][j-1]+Math.abs(a[0]-b[j]);for(let i=1;i<n;i++)for(let j=1;j<m;j++)dp[i][j]=Math.abs(a[i]-b[j])+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[n-1][m-1]}function similarity(a,b){return Math.max(0,1-dtw(a,b)/a.length)}const SYMBOLS=['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','ADAUSDT','DOGEUSDT','AVAXUSDT','DOTUSDT','MATICUSDT','LINKUSDT','UNIUSDT','ATOMUSDT','LTCUSDT','NEARUSDT','APTUSDT','ARBUSDT','OPUSDT','INJUSDT','SUIUSDT','SEIUSDT','TIAUSDT','WLDUSDT','STXUSDT','RUNEUSDT','JUPUSDT','ENAUSDT','MNTUSDT','LDOUSDT','AAVEUSDT','MKRUSDT','CRVUSDT','GMXUSDT','SANDUSDT','FETUSDT','RENDERUSDT','THETAUSDT','FLOWUSDT','IMXUSDT','GALAUSDT'];async function fetchCandles(symbol,interval,limit=60){try{const r=await fetch(`https://api.bybit.com/v5/market/kline?symbol=${symbol}&interval=${interval}&limit=${limit}&category=linear`);const d=await r.json();if(d.result&&d.result.list&&d.result.list.length>0){return d.result.list.reverse().map(c=>({c:parseFloat(c[4])}))}}catch(e){}return null}function candlesToNorm(candles,len=50){const closes=candles.map(c=>c.c);const step=(closes.length-1)/(len-1);const resampled=Array.from({length:len},(_,i)=>{const idx=i*step;const lo=Math.floor(idx),hi=Math.min(Math.ceil(idx),closes.length-1);const t=idx-lo;return closes[lo]+t*(closes[hi]-closes[lo])});const mn=Math.min(...resampled),mx=Math.max(...resampled);const range=mx-mn||1;return resampled.map(v=>(v-mn)/range)}function priceChange(candles){if(!candles||candles.length<2)return 0;return((candles[candles.length-1].c-candles[0].c)/candles[0].c*100).toFixed(2)}function setStatus(msg,loading=false){statusBar.innerHTML=loading?`<div class="loader"></div><span>${msg}</span>`:`<span>${msg}</span>`}function drawMiniChart(canvas,closes,color){const ctx=canvas.getContext('2d');const w=canvas.width=canvas.offsetWidth||140;const h=canvas.height=44;ctx.clearRect(0,0,w,h);const mn=Math.min(...closes),mx=Math.max(...closes);const range=mx-mn||1;const pts=closes.map((v,i)=>({x:(i/(closes.length-1))*w,y:h-((v-mn)/range)*(h-4)-2}));const grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,color+'44');grad.addColorStop(1,color+'00');ctx.beginPath();ctx.moveTo(pts[0].x,h);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(pts[pts.length-1].x,h);ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.stroke()}scanBtn.addEventListener('click',async()=>{if(rawPoints.length<10)return;const patternNorm=normalizePoints(rawPoints,50);const topN=parseInt(document.getElementById('topN').value);scanBtn.disabled=true;setStatus(`Загружаем... 0/${SYMBOLS.length}`,true);resultsGrid.style.display='none';emptyState.style.display='flex';emptyState.innerHTML='<div class="big">⏳</div><p>Сканирование...</p>';resultCount.textContent='—';const results=[];let done=0;await Promise.all(SYMBOLS.map(async sym=>{const candles=await fetchCandles(sym,selectedTF,80);done++;setStatus(`Загружаем... ${done}/${SYMBOLS.length}`,true);if(!candles||candles.length<20)return;const norm=candlesToNorm(candles,50);const score=similarity(patternNorm,norm);const change=priceChange(candles);results.push({symbol:sym,score,change:parseFloat(change),closes:candles.map(c=>c.c),price:candles[candles.length-1].c})}));results.sort((a,b)=>b.score-a.score);const top=results.slice(0,topN);setStatus(`Найдено: ${top.length} совпадений из ${SYMBOLS.length} пар`,false);resultCount.textContent=top.length;if(top.length===0){emptyState.style.display='flex';emptyState.innerHTML='<div class="big">🔍</div><p>Совпадений не найдено</p>';resultsGrid.style.display='none';scanBtn.disabled=false;return}emptyState.style.display='none';resultsGrid.style.display='grid';resultsGrid.innerHTML='';top.forEach(r=>{const pct=Math.round(r.score*100);const scoreClass=pct>=75?'high':pct>=55?'mid':'low';const color=pct>=75?'#00d4aa':pct>=55?'#3d8eff':'#4a5568';const changeClass=r.change>=0?'up':'down';const changeStr=(r.change>=0?'+':'')+r.change+'%';const base=r.symbol.replace('USDT','');const card=document.createElement('div');card.className='result-card';card.innerHTML=`<div class="card-top"><div><div class="token-name">${base}</div><div class="token-pair">${r.symbol}</div></div><div style="text-align:right"><div class="match-score ${scoreClass}">${pct}%</div><div class="match-label">match</div></div></div><div class="score-bar"><div class="score-fill" style="width:${pct}%;background:${color}"></div></div><div class="mini-chart"><canvas></canvas></div><div class="card-meta"><span>$${r.price<1?r.price.toFixed(5):r.price.toFixed(2)}</span><span class="change ${changeClass}">${changeStr}</span></div>`;resultsGrid.appendChild(card);requestAnimationFrame(()=>{drawMiniChart(card.querySelector('.mini-chart canvas'),r.closes,color)})});scanBtn.disabled=false});window.addEventListener('resize',resizeCanvas);resizeCanvas();</script></body></html>
